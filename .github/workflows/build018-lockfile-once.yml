name: BUILD-018 Generate Lockfile Once

on:
  push:
    branches:
      - build/018-cloudflare-foundation
    paths:
      - .github/workflows/build018-lockfile-once.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/build/018-cloudflare-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/018-cloudflare-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate real npm lockfile
        working-directory: cloudflare/worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile to build branch
        run: |
          test -s cloudflare/worker/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/worker/package-lock.json
          git diff --cached --quiet || (git commit -m 'BUILD-018: lock npm dependencies' && git push origin HEAD:build/018-cloudflare-foundation)

name: Tax Genie Cloudflare Bootstrap CI

on:
  pull_request:
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/cloudflare-bootstrap-ci.yml"
  push:
    branches:
      - "build/018-cloudflare-foundation"
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/cloudflare-bootstrap-ci.yml"

permissions:
  contents: read

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (CI only)
        run: npm install --ignore-scripts
      - name: Synthetic Worker contract tests
        run: npm test
      - name: Cloudflare Worker bundling dry run (no deploy)
        run: npm run build
